name: Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      skip_build:
        description: 'Skip build verification'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

env:
  VULKAN_SDK_VERSION: '1.3.290.0'

jobs:
  # Step 1: Run full CI build
  build:
    name: Build Verification
    if: github.event.inputs.skip_build != 'true'
    uses: ./.github/workflows/ci.yml

  # Step 2: Bump version and create tag
  version:
    name: Bump Version
    needs: [build]
    if: always() && (needs.build.result == 'success' || github.event.inputs.skip_build == 'true')
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current version
        id: read_version
        run: |
          VERSION=$(cat version/VERSION)
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Determine bump type
        id: determine_bump
        run: |
          # Use input if provided, otherwise default to patch
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          if [ -z "$BUMP_TYPE" ]; then
            # Auto-detect from commit messages (optional enhancement)
            # For now, default to patch
            BUMP_TYPE="patch"
          fi
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Bump type: $BUMP_TYPE"

      - name: Bump version
        id: bump
        run: |
          VERSION="${{ steps.read_version.outputs.current_version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          case "${{ steps.determine_bump.outputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "$NEW_VERSION" > version/VERSION
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update vcpkg port version
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          
          # Update vcpkg.json version
          sed -i "s/\"version\": \".*\"/\"version\": \"$NEW_VERSION\"/" vcpkg/ports/wisdom/vcpkg.json
          
          # Update versions/w-/wisdom.json
          cat > vcpkg/versions/w-/wisdom.json << EOF
          {
            "default": {
              "wisdom": {
                "baseline": "$NEW_VERSION",
                "port-version": 0
              }
            }
          }
          EOF

      - name: Commit version bump
        run: |
          git add version/VERSION vcpkg/
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Create and push tag
        run: |
          git tag -a "${{ steps.bump.outputs.tag_name }}" -m "Release ${{ steps.bump.outputs.tag_name }}"
          git push origin "${{ steps.bump.outputs.tag_name }}"

  # Step 3: Build packages
  package:
    name: Build Packages
    needs: [version]
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag_name }}
          fetch-depth: 0
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      
      - name: Setup CMake
        uses: lukka/get-cmake@v3.30.5
      
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
      
      - name: Build and Package
        shell: pwsh
        run: |
          .\package.ps1 -Format all -Clean -OutputDir './artifacts'
      
      - name: Upload NuGet Package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
      
      - name: Upload ZIP Package
        uses: actions/upload-artifact@v4
        with:
          name: zip-package
          path: artifacts/*.zip
          if-no-files-found: error

  # Step 4: Create GitHub Release with packages
  release:
    name: Create Release
    needs: [version, package]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download NuGet Package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts
      
      - name: Download ZIP Package
        uses: actions/download-artifact@v4
        with:
          name: zip-package
          path: ./artifacts
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Release ${{ needs.version.outputs.tag_name }}
          files: |
            artifacts/*.nupkg
            artifacts/*.zip
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 5: Publish to NuGet
  publish-nuget:
    name: Publish to NuGet.org
    needs: [release]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download NuGet Package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts
      
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
      
      - name: Publish to NuGet.org
        run: |
          for pkg in ./artifacts/*.nupkg; do
            nuget push "$pkg" -Source https://api.nuget.org/v3/index.json -ApiKey ${{ secrets.NUGET_API_KEY }} -SkipDuplicate
          done

  # Step 6: Build and deploy documentation
  docs:
    name: Deploy Documentation
    needs: [version]
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag_name }}
          fetch-depth: 0
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz ninja-build
      
      - name: Setup Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.0.5
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
          cache: true
          optional_components: com.lunarg.vulkan.vma
      
      - name: Setup CMake
        uses: lukka/get-cmake@v3.30.5
      
      - name: Configure CMake
        run: cmake --preset linux-gcc-docs
      
      - name: Build Documentation
        run: cmake --build --preset linux-gcc-docs
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/build/linux-gcc-docs/docs/html/
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
