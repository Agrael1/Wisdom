name: CI

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'dev/**'
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - master
      - main
  workflow_call:  # Allow this workflow to be called by other workflows
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CMAKE_VERSION: '3.28'

jobs:
  build-windows-dx12:
    name: Windows (DirectX 12)
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      
      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      
      - name: Configure CMake
        run: cmake --preset x64-release
      
      - name: Build
        run: cmake --build --preset x64-release

  build-windows-vulkan:
    name: Windows (Vulkan)
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true
      
      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      
      - name: Configure CMake
        run: cmake --preset x64-release -DWISDOM_FORCE_VULKAN=ON
      
      - name: Build
        run: cmake --build --preset x64-release

  build-windows-clang:
    name: Windows (Clang + Vulkan)
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64
      
      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.12.0
      
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true
      
      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      
      - name: Configure CMake
        run: cmake --preset win-clang-release -DWISDOM_FORCE_VULKAN=ON
      
      - name: Build
        run: cmake --build --preset win-clang-release

  build-linux:
    name: Linux (Vulkan)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true
      
      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      
      - name: Configure CMake
        run: cmake --preset linux-release
      
      - name: Build
        run: cmake --build --preset linux-release
